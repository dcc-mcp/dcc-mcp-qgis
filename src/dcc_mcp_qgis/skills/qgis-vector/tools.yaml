tools:
- name: create_layer
  description: Create a 2D memory vector layer with typed fields.
  source_file: scripts/create_layer.py
  input_schema:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
      geometry_type:
        type: string
        enum:
        - Point
        - LineString
        - Polygon
      crs:
        type: string
        minLength: 1
        maxLength: 16
      fields:
        type: array
        maxItems: 32
        items:
          type: object
          required:
          - name
          - type
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
            type:
              type: string
              enum:
              - string
              - integer
              - number
              - boolean
          additionalProperties: false
    required:
    - name
    - geometry_type
    additionalProperties: false
  output_schema: &id002
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations: &id003
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: false
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: query_features
  description: Read a bounded page of features, attributes, WKT and planar areas.
  source_file: scripts/query_features.py
  input_schema:
    type: object
    properties:
      layer_id: &id001
        type: string
        minLength: 1
        maxLength: 128
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      offset:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    required:
    - layer_id
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
    deferred_hint: false
- name: add_features
  description: Validate then add at most 1000 WKT features in one layer edit transaction.
  source_file: scripts/add_features.py
  input_schema:
    type: object
    properties:
      layer_id: *id001
      features:
        type: array
        minItems: 1
        maxItems: 1000
        items:
          type: object
          required:
          - wkt
          properties:
            wkt:
              type: string
              minLength: 1
              maxLength: 10000
            attributes:
              type: object
              maxProperties: 32
          additionalProperties: false
    required:
    - layer_id
    - features
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
      job_id:
        type: string
        minLength: 1
      core_job_id:
        type: string
        minLength: 1
      job_id_owner:
        const: core
      status:
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
        - interrupted
      core_poll:
        type: object
    anyOf:
    - required:
      - success
      - message
      - error
      - context
    - required:
      - job_id
      - core_job_id
      - job_id_owner
      - status
      - core_poll
  execution: async
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  job_strategy: monolithic
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: update_feature
  description: Edit one feature geometry and/or typed attributes with readback.
  source_file: scripts/update_feature.py
  input_schema:
    type: object
    properties:
      layer_id: *id001
      feature_id:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
      attributes:
        type: object
        maxProperties: 32
      wkt:
        type: string
        minLength: 1
        maxLength: 10000
    required:
    - layer_id
    - feature_id
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: false
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: export_layer
  description: Export a layer to a new GeoJSON or GeoPackage and verify by reopening.
  source_file: scripts/export_layer.py
  input_schema:
    type: object
    properties:
      layer_id: *id001
      path:
        type: string
        minLength: 1
        maxLength: 1024
      format:
        type: string
        enum:
        - GeoJSON
        - GPKG
        default: GeoJSON
    required:
    - layer_id
    - path
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
      job_id:
        type: string
        minLength: 1
      core_job_id:
        type: string
        minLength: 1
      job_id_owner:
        const: core
      status:
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
        - interrupted
      core_poll:
        type: object
    anyOf:
    - required:
      - success
      - message
      - error
      - context
    - required:
      - job_id
      - core_job_id
      - job_id_owner
      - status
      - core_poll
  execution: async
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  job_strategy: monolithic
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: style_layer
  description: Apply bounded single/categorized vector symbols and optional field labels.
  source_file: scripts/style_layer.py
  input_schema:
    type: object
    properties:
      layer_id:
        type: string
        minLength: 1
      color:
        type: string
        default: '#38bdf8'
      outline_color:
        type: string
        default: '#0f172a'
      opacity:
        type: number
        minimum: 0
        maximum: 1
        default: 1
      width:
        type: number
        minimum: 0.1
        maximum: 5
        default: 0.5
      size:
        type: number
        minimum: 0.5
        maximum: 20
        default: 3
      category_field:
        type: string
      categories:
        type: array
        maxItems: 32
        items:
          type: object
          required:
          - value
          - color
          properties:
            value:
              type: string
              maxLength: 128
            color:
              type: string
          additionalProperties: false
      label_field:
        type: string
      label_size:
        type: number
        minimum: 6
        maximum: 32
        default: 10
      label_color:
        type: string
        default: '#0f172a'
      label_buffer_size:
        type: number
        minimum: 0
        maximum: 2
        default: 0.7
        description: Label halo width in millimeters; zero disables the buffer.
      label_buffer_color:
        type: string
        pattern: '^#[0-9a-fA-F]{6}$'
        default: '#ffffff'
      font_family:
        type: string
        minLength: 1
        maxLength: 80
        description: Exact name of a font family already installed on this host.
      label_bold:
        type: boolean
        default: false
    required:
    - layer_id
    additionalProperties: false
  output_schema: *id002
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations: *id003
  next-tools:
    on-failure:
    - qgis_project__inspect_project
