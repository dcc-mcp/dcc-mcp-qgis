tools:
- name: status
  description: Inspect the owned headless QGIS runtime and limits.
  source_file: scripts/status.py
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
    deferred_hint: false
- name: get_capabilities
  description: List supported typed workflows and explicit limitations.
  source_file: scripts/get_capabilities.py
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
    deferred_hint: false
- name: inspect_project
  description: Query project CRS, layer IDs, names, counts and field schemas.
  source_file: scripts/inspect_project.py
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
    deferred_hint: false
- name: new_project
  description: Create an empty owned project, refusing unsaved changes by default.
  source_file: scripts/new_project.py
  input_schema:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 128
      crs:
        type: string
        minLength: 1
        maxLength: 16
      discard_changes:
        type: boolean
        default: false
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
  execution: sync
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 30
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: false
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: save_project
  description: Save an immutable QGZ and GeoPackage bundle to a new directory.
  source_file: scripts/save_project.py
  input_schema:
    type: object
    properties:
      directory:
        type: string
        minLength: 1
        maxLength: 1024
    required:
    - directory
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
      job_id:
        type: string
        minLength: 1
      core_job_id:
        type: string
        minLength: 1
      job_id_owner:
        const: core
      status:
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
        - interrupted
      core_poll:
        type: object
    anyOf:
    - required:
      - success
      - message
      - error
      - context
    - required:
      - job_id
      - core_job_id
      - job_id_owner
      - status
      - core_poll
  execution: async
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  job_strategy: monolithic
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: reopen_project
  description: Reopen a validated adapter bundle into editable memory layers.
  source_file: scripts/reopen_project.py
  input_schema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      discard_changes:
        type: boolean
        default: false
    required:
    - path
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
      job_id:
        type: string
        minLength: 1
      core_job_id:
        type: string
        minLength: 1
      job_id_owner:
        const: core
      status:
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
        - interrupted
      core_poll:
        type: object
    anyOf:
    - required:
      - success
      - message
      - error
      - context
    - required:
      - job_id
      - core_job_id
      - job_id_owner
      - status
      - core_poll
  execution: async
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  job_strategy: monolithic
  next-tools:
    on-failure:
    - qgis_project__inspect_project
- name: render_map
  description: Render all project layers to a new PNG file.
  source_file: scripts/render_map.py
  input_schema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 1024
      width:
        type: integer
        minimum: 64
        maximum: 2048
        default: 800
      height:
        type: integer
        minimum: 64
        maximum: 2048
        default: 600
    required:
    - path
    additionalProperties: false
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type:
        - object
        - 'null'
      job_id:
        type: string
        minLength: 1
      core_job_id:
        type: string
        minLength: 1
      job_id_owner:
        const: core
      status:
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
        - interrupted
      core_poll:
        type: object
    anyOf:
    - required:
      - success
      - message
      - error
      - context
    - required:
      - job_id
      - core_job_id
      - job_id_owner
      - status
      - core_poll
  execution: async
  affinity: main
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  job_strategy: monolithic
  next-tools:
    on-failure:
    - qgis_project__inspect_project
