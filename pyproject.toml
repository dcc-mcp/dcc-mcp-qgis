[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-qgis"
version = "0.1.0"
description = "Typed, main-thread PyQGIS project and vector tools for DCC-MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = ["dcc-mcp-core==0.20.41", "dcc-mcp-server==0.20.41"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12", "build>=1.2", "pyyaml>=6", "jsonschema>=4.23", "mcp==2.2.0"]

[project.scripts]
dcc-mcp-qgis = "dcc_mcp_qgis.cli:main"

[project.urls]
Repository = "https://github.com/dcc-mcp/dcc-mcp-qgis"
Issues = "https://github.com/dcc-mcp/dcc-mcp-qgis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_qgis"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an installed QGIS runtime"]
